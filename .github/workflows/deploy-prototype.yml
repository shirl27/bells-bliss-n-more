name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main, phase0-mvp-e2e-split]
    paths: [prototypes/bells-bliss-n-more/**, scripts/build-prototype-variants.js]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate end-2-end / mvp / phase0 prototype variants
        run: node scripts/build-prototype-variants.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
